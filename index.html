<!doctype html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FreshStamp | Smart Expiry Tracking</title>
    <meta name="description" content="FreshStamp — Smart expiry tracking, inventory management, and food waste reduction with Gemini AI." />
    
    <!-- PWA Settings & Icons -->
    <meta name="theme-color" content="#22301f" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="FreshStamp" />
    <meta name="application-name" content="FreshStamp" />
    <meta name="msapplication-TileColor" content="#22301f" />
    
    <!-- App Icons with Cache Busting -->
    <link rel="icon" type="image/png" href="/icons/logo.png?v=1.0.1" />
    <link rel="apple-touch-icon" href="/icons/logo.png?v=1.0.1" />
    <link rel="manifest" href="/manifest.json?v=1.0.1" />
  </head>
  <body>
    <div id="root">
      <div id="initial-splash" style="position:fixed;inset:0;background-color:#fbf9f6;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;user-select:none;">
        <style>
          @keyframes splashPulse {
            0% { transform: scale(0.96); opacity: 0.88; }
            50% { transform: scale(1.02); opacity: 1; }
            100% { transform: scale(0.96); opacity: 0.88; }
          }
          @keyframes splashBar {
            0% { width: 0%; }
            50% { width: 65%; }
            100% { width: 100%; }
          }
          .splash-logo-img {
            max-width: 270px;
            width: 75vw;
            height: auto;
            object-fit: contain;
            animation: splashPulse 2s ease-in-out infinite;
          }
          .splash-bar-container {
            width: 130px;
            height: 3px;
            background: rgba(34, 48, 31, 0.12);
            border-radius: 999px;
            overflow: hidden;
            margin-top: 22px;
          }
          .splash-bar-fill {
            height: 100%;
            background: #3E9B4F;
            border-radius: 999px;
            animation: splashBar 1.4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
          }
        </style>
        <img src="/logo-with-freshstamp-name.png?v=1.0.1" alt="FreshStamp" class="splash-logo-img" />
        <div class="splash-bar-container">
          <div class="splash-bar-fill"></div>
        </div>
        <p style="margin-top:14px;font-size:11px;color:#546250;letter-spacing:0.04em;font-weight:500;">
          Smart Expiry Tracking
        </p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
